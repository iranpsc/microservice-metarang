apiVersion: v1
kind: ConfigMap
metadata:
  name: metarang-config
  namespace: metarang
data:
  # Database Configuration
  db.host: "mysql"
  db.port: "3306"
  db.database: "metarang_db"
  
  # Redis Configuration
  redis.host: "redis"
  redis.port: "6379"
  redis.db: "0"
  
  # OAuth Configuration
  oauth.server.url: "https://oauth.metarang.com"
  
  # Kong Gateway
  kong.admin.url: "http://kong-admin.metarang.svc.cluster.local:8001"
  
  # Application Settings
  app.environment: "production"
  app.log.level: "info"
  app.url: "https://api.metarang.com"
  frontend.url: "https://world.metarang.com"
  admin.panel.url: "https://admin.metarang.com"
  cors.origin: "https://world.metarang.com"

  # FTP / Storage
  ftp.host: "ftp.metarang.com"
  ftp.port: "21"
  ftp.base.path: "/uploads"
  ftp.base.url: "https://cdn.metarang.com/uploads"

  # Sentry Error Monitoring
  sentry.environment: "production"
  sentry.release: ""
  sentry.traces_sample_rate: "0"
