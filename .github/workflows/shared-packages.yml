name: Shared Packages CI

on:
  push:
    paths:
      - 'shared/**'
      - '.github/workflows/shared-packages.yml'
      - '.github/scripts/**'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'shared/**'
      - '.github/workflows/shared-packages.yml'
      - '.github/scripts/**'
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-shared:
    name: Test Shared Packages
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: metarang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: shared/go.mod
          cache-dependency-path: shared/go.sum

      - name: Install dependencies
        run: |
          cd shared
          go mod download
          go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.9.0
          working-directory: shared
          args: --timeout=5m

      - name: Initialize test report
        run: |
          {
            echo "# Test Results: Shared Packages"
            echo ""
            echo "Checklist of every test suite and individual test executed in this job."
            echo ""
            echo "## Detailed Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: unit_tests
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: metarang_test
          DB_USER: root
          DB_PASSWORD: root_password
        run: |
          bash .github/scripts/go-test-checklist.sh \
            "Shared Package Tests (shared/pkg/...)" \
            "shared" \
            -- ./pkg/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          bash .github/scripts/govulncheck-checklist.sh \
            "Security Scan (govulncheck)" \
            "shared"

      - name: Finalize test checklist
        if: always()
        run: |
          unit_status="${{ steps.unit_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
          vuln_status="${{ steps.govulncheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"

          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Test suite | Status |"
            echo "|------------|--------|"
            echo "| Shared package tests | ${unit_status} |"
            echo "| govulncheck | ${vuln_status} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          [ "${{ steps.unit_tests.outcome }}" = "success" ] || failed=1
          [ "${{ steps.govulncheck.outcome }}" = "success" ] || failed=1
          exit "$failed"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./shared/coverage.out
          flags: shared
          name: shared-packages
          fail_ci_if_error: false
